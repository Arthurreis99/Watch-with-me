name: Validate Watch With Me

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Check types
        run: npx tsc --noEmit

      - name: Test and build application
        run: npm test

      - name: Build static client
        run: npm run build:pages
        env:
          VITE_WATCH_API_BASE: https://watch-with-me.ocatolico.chatgpt.site
